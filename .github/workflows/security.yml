# Security CI — board #9945  (SOC 2 CC3.4 / CC8.1 · ISO 27001 A.8.29 + A.8.4)
#
# BLOCKING gates on every pull request and every push to main:
#   1. secret-scan     gitleaks over the commits this change introduces.
#                      Ruleset mirrors the Brain-side weekly scan
#                      (/opt/cron-checks/secret-scan/gitleaks.toml); accepted
#                      historical findings live in .gitleaksignore.
#   2. sast            CodeQL. Fails on any high/critical finding
#                      (security-severity >= 7.0) not listed in
#                      .github/codeql-baseline.txt.
#   3. security-tests  the repo's security regression suite (Ed25519-signed
#                      auto-update + downgrade gate, /ws/agent HMAC auth).
#
# Copied from Infinihash/infra-gateway .github/workflows/security.yml via
# Infinihash/observability (secret-scan and sast job STEPS verbatim, same
# .gitleaks.toml). Differences, all deliberate:
#   * runs-on: ubuntu-latest instead of [self-hosted, linux, x64]. This repo
#     is PUBLIC; the org's self-hosted runner group does not (and must not)
#     serve public repos, whose fork PRs would run untrusted code on the LAN.
#     See the note in pre-merge.yml. The $RUNNER_TEMP / SARIF-provenance
#     hardening below is kept as-is; it is harmless on hosted runners.
#   * security-tests runs myai-agent's own security suites (below).
#
# Honest limitations, recorded here so an auditor does not have to guess:
#   * CodeQL runs with `upload: false` and the gate is enforced inside the
#     workflow (same as every other Infinihash repo), so the job needs no
#     security-events: write token and the Security tab is not fed.
#   * All three jobs are required status checks on main (branch protection),
#     alongside "Pre-merge checks".
#   * There is no deploy workflow; releases are tag-triggered (bundle.yml,
#     publish.yml), so this workflow can never wedge a release.

name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks) - BLOCKING
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned 8.21.2)
        run: |
          # Install into a runner-writable dir rather than /usr/local/bin.
          # GitHub-hosted runners give the job passwordless sudo; our CT220
          # self-hosted runner deliberately does NOT — a runner that executes
          # PR-authored code should not be able to become root. Installing to
          # $RUNNER_TEMP works identically on both.
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gl.tgz"
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Determine commit range
        id: range
        env:
          EV: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EV" = "pull_request" ]; then BASE="$PR_BASE"; HEAD="$PR_HEAD"; else BASE="$PUSH_BEFORE"; HEAD="$SHA"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "New branch / unknown base - scanning HEAD commit only."
            echo "log_opts=--no-merges -n 1 $HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "Scanning $BASE..$HEAD"
            echo "log_opts=--no-merges $BASE..$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks - commits introduced by this change (BLOCKING)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "$LOG_OPTS" \
            --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          echo "No new secrets introduced by this change."

      - name: gitleaks - full history (advisory, mirrors the weekly Brain scan)
        if: always()
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 0 || true

  sast:
    name: SAST (CodeQL) - BLOCKING on high/critical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Analyze (upload disabled - no Advanced Security on this plan)
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          # No Advanced Security on this plan - the CodeQL database upload would
          # 404/retry and red-line the job on default-branch pushes.
          upload-database: false
          # CT220 runs 4 concurrent self-hosted runner processes sharing one OS.
          # /tmp/codeql-results was a FIXED path shared by all of them: a
          # concurrent CodeQL job for a different repo (e.g. ClearBox, JS/TS)
          # could write its javascript.sarif into this same directory while
          # this job's gate step was reading it, making an unrelated repo's
          # pre-existing JS findings appear as "new" high/critical findings
          # here (no baseline entry exists for js/* rules in this repo).
          # runner.temp is unique per job on both hosted and self-hosted
          # runners, which eliminates the cross-job collision.
          output: ${{ runner.temp }}/codeql-results

      - name: Verify SARIF provenance (BLOCKING)
        # A gate that reads the wrong SARIF (or none) and concludes "clean" is
        # worse than one that fails loudly. This proves the file about to be
        # trusted was actually produced FOR THIS checkout before any severity
        # filtering happens - the hardening added after the discovery that the
        # fixed-path collision (fixed by moving output to $RUNNER_TEMP, see
        # above) is symmetric: it can also produce a false PASS.
        run: |
          set -euo pipefail
          shopt -s nullglob
          sarifs=( "$RUNNER_TEMP"/codeql-results/*.sarif )
          if [ ${#sarifs[@]} -eq 0 ]; then
            echo "::error::No SARIF file was produced by CodeQL Analyze. This means the scan did not run - it is NOT the same as 'no findings' and must not be treated as a pass."
            exit 1
          fi
          if [ ${#sarifs[@]} -gt 1 ]; then
            echo "::error::Expected exactly one SARIF for this job's language, found ${#sarifs[@]}: ${sarifs[*]}"
            exit 1
          fi
          SARIF="${sarifs[0]}"

          # Real codeql-action (upload: false) SARIF does not populate
          # run-level originalUriBaseIds with a resolvable absolute path -
          # %SRCROOT% stays a symbolic uriBaseId. So provenance is verified
          # the way the task itself points at: every file path the SARIF
          # names must resolve to a real file in THIS checkout. Critically,
          # runs[0].artifacts lists every file CodeQL scanned - not just
          # files with findings - so this also catches a foreign SARIF with
          # ZERO results (the false-PASS case: repo A reading repo B's
          # clean/baselined scan and concluding "no new findings").
          # SARIF artifactLocation.uri is percent-encoded per the SARIF spec
          # (e.g. a Next.js dynamic route file like app/api/foo/[id]/route.ts
          # is stored as app/api/foo/%5Bid%5D/route.ts) - decode before
          # comparing against git ls-files, which prints literal filenames,
          # or every real repo containing bracket/space-y paths would look
          # foreign to this check and false-fail.
          jq -r '.runs[0].artifacts[]?.location.uri // empty' "$SARIF" | python3 -c "import sys,urllib.parse; [print(urllib.parse.unquote(l.rstrip())) for l in sys.stdin]" | sort -u > "$RUNNER_TEMP/artifact_uris.txt"
          jq -r '.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri // empty' "$SARIF" | python3 -c "import sys,urllib.parse; [print(urllib.parse.unquote(l.rstrip())) for l in sys.stdin]" | sort -u > "$RUNNER_TEMP/result_uris.txt"
          cat "$RUNNER_TEMP/artifact_uris.txt" "$RUNNER_TEMP/result_uris.txt" | sort -u > "$RUNNER_TEMP/sarif_uris.txt"

          if [ ! -s "$RUNNER_TEMP/sarif_uris.txt" ]; then
            echo "::error::SARIF at $SARIF lists no scanned artifacts and no result locations at all. A real scan of a non-empty repo always enumerates the files it scanned - an unverifiable SARIF like this must not be trusted as a pass."
            exit 1
          fi

          git ls-files | sort -u > "$RUNNER_TEMP/repo_files.txt"
          comm -23 "$RUNNER_TEMP/sarif_uris.txt" "$RUNNER_TEMP/repo_files.txt" > "$RUNNER_TEMP/foreign_paths.txt" || true
          if [ -s "$RUNNER_TEMP/foreign_paths.txt" ]; then
            echo "::error::SARIF at $SARIF references files that do not exist in this checkout - treating it as foreign/untrustworthy (the cross-job SARIF collision class: a concurrent job on another repo produced or left this file):"
            cat "$RUNNER_TEMP/foreign_paths.txt"
            exit 1
          fi
          echo "SARIF provenance verified: all $(wc -l < "$RUNNER_TEMP/sarif_uris.txt") file paths referenced by $SARIF ($(wc -l < "$RUNNER_TEMP/artifact_uris.txt") scanned artifacts, $(wc -l < "$RUNNER_TEMP/result_uris.txt") from results) exist in this checkout."

      - name: Gate on high/critical findings (BLOCKING)
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/baseline.txt"
          if [ -f .github/codeql-baseline.txt ]; then
            grep -vE '^[[:space:]]*(#|$)' .github/codeql-baseline.txt | sort -u > "$RUNNER_TEMP/baseline.txt" || true
          fi
          : > "$RUNNER_TEMP/high.txt"
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/codeql-results/*.sarif; do
            jq -r '
              .runs[] as $r
              | ( ($r.tool.driver.rules // [])
                  + ([ ($r.tool.extensions // [])[] | (.rules // []) ] | flatten) ) as $rules
              | ( $rules
                  | map({ key: .id,
                          value: ((.properties["security-severity"] // "0") | tonumber) })
                  | from_entries ) as $sev
              | $r.results[]
              | select( ($sev[.ruleId] // 0) >= 7.0 )
              | "\(.ruleId)|\(.locations[0].physicalLocation.artifactLocation.uri)"
            ' "$f" >> "$RUNNER_TEMP/high.txt"
          done
          sort -u "$RUNNER_TEMP/high.txt" -o "$RUNNER_TEMP/high.txt"
          echo "High/critical CodeQL findings in this checkout: $(wc -l < "$RUNNER_TEMP/high.txt")"
          echo "Baselined (pre-existing, tracked on the work board): $(wc -l < "$RUNNER_TEMP/baseline.txt")"
          comm -23 "$RUNNER_TEMP/high.txt" "$RUNNER_TEMP/baseline.txt" > "$RUNNER_TEMP/new.txt" || true
          if [ -s "$RUNNER_TEMP/new.txt" ]; then
            echo "::error::New high/critical CodeQL findings (not baselined):"
            cat "$RUNNER_TEMP/new.txt"
            echo
            echo "Fix them, or - if genuinely accepted - add the exact lines above to"
            echo ".github/codeql-baseline.txt with a work-board ticket reference."
            exit 1
          fi
          echo "No new high/critical CodeQL findings."

      - name: Full CodeQL finding summary (advisory)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/codeql-results/*.sarif; do
            echo "== $f"
            jq -r '
              .runs[] as $r
              | ( ($r.tool.driver.rules // [])
                  + ([ ($r.tool.extensions // [])[] | (.rules // []) ] | flatten) ) as $rules
              | ( $rules
                  | map({ key: .id,
                          value: ((.properties["security-severity"] // "0") | tonumber) })
                  | from_entries ) as $sev
              | [ $r.results[] | ($sev[.ruleId] // 0) ]
              | { total: length,
                  critical: (map(select(. >= 9.0)) | length),
                  high:     (map(select(. >= 7.0 and . < 9.0)) | length),
                  medium:   (map(select(. >= 4.0 and . < 7.0)) | length),
                  low:      (map(select(. > 0  and . < 4.0)) | length),
                  unscored: (map(select(. == 0)) | length) }
            ' "$f"
          done

  security-tests:
    name: Security regression tests - BLOCKING
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYAI_ADMIN_SECRET: ci-stub-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (venv under $RUNNER_TEMP)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pytest cryptography "websocket-client>=1.6"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: myai-agent security regression suite - BLOCKING
        # test_update_sig.py pins the auto-update trust chain that replaced the
        # unsigned-update RCE (#9671 / T10769): unsigned, wrong-length and
        # tampered artifacts are rejected, downgrades refused unless
        # MYAI_ALLOW_DOWNGRADE=1, backup + rollback work. test_ws_agent.py pins
        # the /ws/agent HMAC query-string auth and job-dispatch wire shape.
        # A security test that silently skips (e.g. a missing crypto dep)
        # must fail the gate, not pass it.
        run: |
          set -euo pipefail
          python -m pytest -q -rs tests/test_update_sig.py tests/test_ws_agent.py | tee "$RUNNER_TEMP/sec.txt"
          if grep -qiE '[0-9]+ skipped' "$RUNNER_TEMP/sec.txt"; then
            echo "::error::security tests were skipped -- treat as failure"; exit 1
          fi
